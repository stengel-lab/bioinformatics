site_name: Stengel Lab Bioinformatics
site_description: Educational bioinformatics tutorials and software reference
site_url: https://stengel-lab.github.io/bioinformatics/
repo_url: https://github.com/stengel-lab/bioinformatics
repo_name: stengel-lab/bioinformatics
edit_uri: ''
docs_dir: docs
site_dir: site
exclude_docs: |
  **/__pycache__/**
  **/*.pyc
theme:
  name: material
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.highlight
validation:
  links:
    anchors: warn
nav:
  - Home: index.md
  - Pipelines:
      - Overview: pipelines/index.md
      - CUT&RUN:
          - Overview: pipelines/cut-and-run/index.md
          - Walkthrough: pipelines/cut-and-run/walkthrough.md
  - Tools: tools/index.md
  - Setup:
      - Overview: setup/index.md
      - Reference resources:
          - hg38: setup/references/hg38.md
