site_name: Stengel Lab Bioinformatics
site_description: Educational bioinformatics tutorials and software reference
site_url: https://stengel-lab.github.io/bioinformatics/
repo_url: https://github.com/stengel-lab/bioinformatics
repo_name: stengel-lab/bioinformatics
edit_uri: ''
docs_dir: docs
site_dir: site
exclude_docs: |
  **/__pycache__/**
  **/*.pyc
theme:
  name: material
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - pymdownx.highlight
validation:
  links:
    anchors: warn
nav:
  - Home: index.md
  - Pipelines: pipelines/index.md
  - Tools: tools/index.md
  - Setup: setup/index.md
